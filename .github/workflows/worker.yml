name: Euro48 worker

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger worker sources
        run: |
          set +e
          FAILED=""
          # All keyless/free sources every run (every 12 min). Adzuna has a
          # hard 2500/month free-tier cap (see lib/sources/adzuna.ts), so it
          # only runs once per hour (top-of-hour) to stay near the intended
          # ~1440 calls/month.
          SOURCES="eures arbeitnow bundesagentur jobtech nav francetravail leforem greenhouse lever"
          if [ "$(date -u +%M)" = "00" ]; then
            SOURCES="$SOURCES adzuna"
          fi

          for source in $SOURCES; do
            status=$(curl -s -o response.json -w "%{http_code}" -X POST \
              "https://euro48.com/api/worker/run?source=$source" \
              -H "Authorization: Bearer ${{ secrets.WORKER_SECRET }}")
            echo "== $source: HTTP $status =="
            cat response.json
            echo
            if [ "$status" -ne 200 ]; then
              FAILED="$FAILED $source"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "Worker call(s) failed:$FAILED"
            exit 1
          fi

          RADAR_SOURCES="visasponsor eurostaffs nextleveljobs jobbatical germanyworkstay eures"
          for source in $RADAR_SOURCES; do
            status=$(curl -s -o response.json -w "%{http_code}" -X POST \
              "https://euro48.com/api/worker/radar?source=$source" \
              -H "Authorization: Bearer ${{ secrets.WORKER_SECRET }}")
            echo "== RADAR $source: HTTP $status =="
            cat response.json
            echo
            if [ "$status" -ne 200 ]; then
              FAILED="$FAILED radar-$source"
            fi
          done

          # Golfo section (gulf_offers table) — separate from everything
          # above, only once per hour (6 Jooble calls per run, one per Gulf
          # country) to stay well within Jooble's free tier.
          if [ "$(date -u +%M)" = "00" ]; then
            status=$(curl -s -o response.json -w "%{http_code}" -X POST \
              "https://euro48.com/api/worker/gulf" \
              -H "Authorization: Bearer ${{ secrets.WORKER_SECRET }}")
            echo "== GOLFO jooble: HTTP $status =="
            cat response.json
            echo
            if [ "$status" -ne 200 ]; then
              echo "Golfo worker call failed (non-fatal, same as RADAR sources above)"
            fi
          fi
